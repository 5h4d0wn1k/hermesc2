# Hermes C2 - loopback lab configuration (committed, hard-gated).
# Runtime secrets are generated by `hermesc2 lab init` into state/ (gitignored),
# never stored here.
lab:
  listen_host: 127.0.0.1
  listen_port: 5555
  allowlist:
    - 127.0.0.1
    - localhost
    - lab-*
  agent_interval: 1.0
  jitter: 0.2
  session_timeout: 60.0
  loss_replay_timeout: 2.0
  safe_commands:
    - date
    - hostname
  sandbox_root: c2_data
  state_dir: state
  passphrase_file: state/lab.passphrase
  key_id_file: state/lab.keyid
  max_session_tasks: 128

agent:
  id: lab-node-01
  server_host: 127.0.0.1
  server_port: 5555
  dry_run: true

payloads:
  out_dir: c2_data/lab_payloads
  max_size: 65536

reports:
  out_dir: reports
  timeline_max: 5000